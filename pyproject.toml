[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hilbert-rl-optimizer"
version = "0.1.0"
description = "Spatial optimization using Hilbert Space-Filling Curves and Reinforcement Learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Pooja Bhavsar", email = "poojabhavsar28@gmail.com" }
]
keywords = ["reinforcement-learning", "hilbert-curve", "spatial-optimization", "warehouse", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "hilbertcurve>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "streamlit>=1.35",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "mlflow>=2.13",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/poojabhavsar28/hilbert-rl-optimizer"
Repository = "https://github.com/poojabhavsar28/hilbert-rl-optimizer"
Issues = "https://github.com/poojabhavsar28/hilbert-rl-optimizer/issues"

# ── Ruff (linter + formatter, replaces black + flake8 + isort) ───────────────
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function call in default args
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── MyPy (type checker) ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
