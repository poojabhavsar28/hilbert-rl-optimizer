name: CI

on:
  push:
    branches: [main, dev, "phase/*"]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-python provides a non-externally-managed interpreter, so
      # `uv pip install --system` works. Without it, uv picks the runner's
      # system Python (PEP 668 "externally managed") and the install fails.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hilbert-rl-optimizer .

      - name: Start container and wait for the health check
        run: |
          docker run -d --name api -p 8000:8000 hilbert-rl-optimizer
          for i in $(seq 1 30); do
            curl -fs localhost:8000/api/health && break || sleep 1
          done

      - name: Smoke test API and UI
        run: |
          curl -fs localhost:8000/api/health | grep '"agent_loaded":true'
          curl -fs localhost:8000/ -o /dev/null
          curl -fs localhost:8000/api/sample-orders.csv -o orders.csv
          curl -fs -F file=@orders.csv -F as_json=true localhost:8000/api/optimize/csv | grep total_saving_pct

      - name: Show container logs
        if: always()
        run: docker logs api
