name: Bug Report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug! Please fill in all sections."

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python scripts/train_ppo.py`
        2. See error at step 200
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Python: 3.11.x
        - OS: Ubuntu 22.04
        - torch: 2.2.0
    validations:
      required: true
